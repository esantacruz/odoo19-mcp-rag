name: Validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
      - run: uv sync --locked --extra dev
      - name: Cache tokenizer needed by offline unit tests
        run: uv run python -c "from src.config import Settings; Settings.from_env().prepare(); import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: bash -n install.sh uninstall.sh odoo19ctl
      - run: uv run pytest -m 'not integration' -q
